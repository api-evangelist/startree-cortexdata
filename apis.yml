name: StarTree (Cortexdata)
description: >-
  StarTree is a real-time analytics company founded by the creators of Apache
  Pinot. Its managed StarTree Cloud platform ingests streaming and batch data
  (Kafka, Confluent, S3, GCS, Iceberg and more), models it, and serves
  sub-second, high-concurrency SQL analytics for customer-facing, agent-facing,
  and operational use cases via a console, client libraries, and REST APIs.
  StarTree Cloud runs as SaaS, BYOC, or BYOK, adds indexing, tiered storage,
  RBAC/SSO, and SOC 2 + ISO 27001 security, and includes the ThirdEye anomaly
  detection product. Authenticated with a console-issued Bearer JWT.
