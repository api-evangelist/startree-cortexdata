overlay: 1.0.0
info:
  title: API Evangelist enhancements for StarTree Cloud Query API
  version: 1.0.0
extends: openapi/startree-cortexdata-query-openapi.json
actions:
  - target: $.info
    update:
      x-apievangelist-provider: startree-cortexdata
      x-apievangelist-enriched: '2026-07-21'
      x-authentication: bearer-jwt
      x-multi-tenant-header: database
  - target: $.paths['/query/sql'].post
    update:
      x-idempotent: false
      x-notes: >-
        Read-only SQL execution against the StarTree Cloud broker. Requires the
        `database` (Workspace ID) header on multi-tenant / Free Tier clusters.
